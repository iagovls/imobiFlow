services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app_network
    depends_on:
      - n8n

  postgres:
    image: postgres:16.4-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16.4-alpine
    container_name: postgres_init
    restart: "no"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - N8N_POSTGRES_DB=${N8N_POSTGRES_DB}
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        if [ "$$(psql -h postgres -U "$${POSTGRES_USER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$${N8N_POSTGRES_DB}'")" != "1" ]; then
          createdb -h postgres -U "$${POSTGRES_USER}" "$${N8N_POSTGRES_DB}"
        fi
  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # n8n Main (recebe webhooks e gerencia workflows)
  n8n:
    image: n8nio/n8n:2.37.9
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - EXECUTIONS_MODE=queue
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=${N8N_TIMEZONE}
      - N8N_USER_VARIABLES_META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - N8N_USER_VARIABLES_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_USER_VARIABLES_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_USER_VARIABLES_SUPABASE_POSTGRES_USER=${SUPABASE_POSTGRES_USER}
      - N8N_USER_VARIABLES_SUPABASE_POSTGRES_PASSWORD=${SUPABASE_POSTGRES_PASSWORD}
      - N8N_USER_VARIABLES_GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}
      - N8N_USER_VARIABLES_GOOGLE_CALENDAR_SECRET_KEY=${GOOGLE_CALENDAR_SECRET_KEY}
      - N8N_USER_VARIABLES_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  # n8n Worker (processa a fila de execuções)
  n8n-worker:
    image: n8nio/n8n:2.37.9
    container_name: n8n-worker
    restart: unless-stopped
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - EXECUTIONS_MODE=queue
      - GENERIC_TIMEZONE=${N8N_TIMEZONE}
      - N8N_USER_VARIABLES_META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - N8N_USER_VARIABLES_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_USER_VARIABLES_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_USER_VARIABLES_SUPABASE_POSTGRES_USER=${SUPABASE_POSTGRES_USER}
      - N8N_USER_VARIABLES_SUPABASE_POSTGRES_PASSWORD=${SUPABASE_POSTGRES_PASSWORD}
      - N8N_USER_VARIABLES_GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}
      - N8N_USER_VARIABLES_GOOGLE_CALENDAR_SECRET_KEY=${GOOGLE_CALENDAR_SECRET_KEY}
      - N8N_USER_VARIABLES_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  mcp_imoveis:
    build:
      context: ./mcp_imoveis
      dockerfile: Dockerfile
    container_name: mcp_imoveis
    restart: unless-stopped
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8000
      - SUPABASE_POSTGRES_DSN=${SUPABASE_POSTGRES_DSN}
      - SUPABASE_POSTGRES_HOST=${SUPABASE_POSTGRES_HOST}
      - SUPABASE_POSTGRES_PORT=${SUPABASE_POSTGRES_PORT}
      - SUPABASE_POSTGRES_DATABASE=${SUPABASE_POSTGRES_DATABASE}
      - SUPABASE_POSTGRES_USER=${SUPABASE_POSTGRES_USER}
      - SUPABASE_POSTGRES_PASSWORD=${SUPABASE_POSTGRES_PASSWORD}
      - SUPABASE_POSTGRES_SSLMODE=${SUPABASE_POSTGRES_SSLMODE}
      - SUPABASE_CONNECT_TIMEOUT=${SUPABASE_CONNECT_TIMEOUT}
      - SUPABASE_DEFAULT_SCHEMA=${SUPABASE_DEFAULT_SCHEMA}
    ports:
      - "8000:8000"
    networks:
      - app_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app_network
    depends_on:
      - n8n

volumes:
  redis_data:
    driver: local
  n8n_data:
    driver: local
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
