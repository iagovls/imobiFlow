<div class="flex flex-col md:items-center md:justify-between justify-center bg-white md:rounded-xl md:border border-t border-solid shadow border-border  md:w-64 md:h-auto px-4 h-14 md:relative bottom-0 w-full md:py-5">

    @if (false) { <app-account-icon></app-account-icon> }

    <div class="hidden md:block ">
        <app-logo-component/>
    </div>
    <nav class=" flex md:flex-col w-full md:gap-0 gap-3 md:justify-center justify-between h-auto ">
        @for (section of menuService.sections; track section.name) {
            <!-- padding precisa ser igual em style do menu.ts -->
            <a 
            routerLink="{{section.link}}"
            routerLinkActive="active"
            class="{{menuService.isSectionActive(section.link) ? style : ''}} md:pl-5 flex justify-start items-center gap-3 p-2"
            >
                <ng-container *ngComponentOutlet="section.icon; inputs:{'size': 6}"></ng-container>
                <h1 class="hidden md:block">{{section.name}}</h1>
            </a>
        }
    </nav>
    <div class="w- bg-olive-200 px-4 py-2 rounded-xl border border-olive-400 hidden md:block">
        <h1 class="text-emerald-600 text-sm tracking-widest font-bold">{{ corretor | uppercase }}</h1>
        <h1 class="text-olive-600 text-xs tracking-widest font-bold">{{ userName() }}</h1>
        <div>
            <h2 class="text-olive-600 text-xs">{{ imoveisAtivos() }} imóveis ativos</h2>
            <h2 class="text-olive-600 text-xs">{{ visitasSemana() }} visitas nos próximos 7 dias</h2>
        </div>
    </div>
    <app-goal class="hidden md:block"/>
</div>
