<div
  class="carousel-viewport"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd()"
>
  @for (img of images; track img.url; let i = $index) {
    <div class="carousel-item" [class.active]="i === currentIndex()">
      <img
        [src]="img.url"
        [alt]="img.alt || ''"
        class="block w-full max-h-[80vh] object-contain mx-auto"
        loading="lazy"
      />
    </div>
  }

  @if (showControls && images.length > 1) {
    <button
      type="button"
      class="carousel-control-prev"
      (click)="prev()"
      [attr.aria-label]="prevCaption"
    >
      <span aria-hidden="true" class="carousel-control-prev-icon"></span>
      <span class="sr-only">{{ prevCaption }}</span>
    </button>
    <button
      type="button"
      class="carousel-control-next"
      (click)="next()"
      [attr.aria-label]="nextCaption"
    >
      <span aria-hidden="true" class="carousel-control-next-icon"></span>
      <span class="sr-only">{{ nextCaption }}</span>
    </button>
  }

  @if (showIndicators && images.length > 1) {
    <div class="carousel-indicators">
      @for (img of images; track img.url; let i = $index) {
        <button
          type="button"
          [class.active]="i === currentIndex()"
          [attr.aria-current]="i === currentIndex()"
          [attr.aria-label]="'Ir para foto ' + (i + 1)"
          (click)="goTo(i)"
        ></button>
      }
    </div>
  }
</div>
